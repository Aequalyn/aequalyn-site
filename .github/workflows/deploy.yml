# Build the site and upload it to the host (easyhost) over FTPS.
#
# Runs on every push to main, once a day (fresh GitHub stars), by hand, and when the
# Market approves something (aequalyn-market sends a "market-updated" repository_dispatch).
#
# Repository settings (Settings, Secrets and variables, Actions):
#   secrets   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   the host's FTP account
#   variables SITE_URL     https://your-domain, for links, the sitemap and sharing previews
#             FTP_DIR      the folder on the host to upload into (default ./public_html/)
#             SITE_MODE    "coming-soon" uploads only coming-soon/index.html; anything else, the site
# Without the FTP secrets the site is still built and kept as an artifact, nothing is uploaded.
name: Deploy the site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [market-updated]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      SITE_MODE: ${{ vars.SITE_MODE }}
    steps:
      - uses: actions/checkout@v4
      - name: The built-in themes and wallpapers
        uses: actions/checkout@v4
        with:
          repository: Aequalyn/aequalyn-themes
          path: .themes
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            LICENSE
            themes/*/theme.json
            themes/*/preview.jpg
            wallpapers/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        if: env.SITE_MODE != 'coming-soon'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 tools/build.py --themes .themes --out public
      - name: Coming soon only
        if: env.SITE_MODE == 'coming-soon'
        run: mkdir -p public && cp coming-soon/index.html public/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 7
      - name: Upload to the host
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ vars.FTP_DIR || './public_html/' }}
          # the counters' store, its salt and the contact settings live only on the host
          exclude: |
            **/.git*
            **/.git*/**
            api/data/stats.json
            api/data/salt.txt
            api/data/contact-rate.json
            api/config.php
