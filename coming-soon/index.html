<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aequalyn · coming soon</title>
<meta name="description" content="Aequalyn, an Arch Linux desktop coloured by your wallpaper. Its website is on its way.">
<meta name="theme-color" content="#0e1718">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='100 130 320 200'%3E%3Cg transform='translate(0 20.5)' fill='none' stroke='%234fc1b0' stroke-width='29.7'%3E%3Ccircle cx='188.8' cy='204.8' r='64'/%3E%3Cpath d='M252.8 204.8v78.8'/%3E%3Cpath d='M380.8 204.8A64 64 0 1 0 365.8 245.9' stroke-linecap='round'/%3E%3Cpath d='M252.8 204.8h128'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* One file, nothing else to upload: the Aequalyn theme, or Aequalyn Day in a light browser. */
  :root { --base: #0e1718; --surface: #141f22; --line: rgb(224 225 229 / .08); --text: #e0e1e5; --soft: #a5a8ac; --muted: #6c7274;
          --accent: #4fc1b0; --cyan: #6fb7d8; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --base: #eef5f4; --surface: #ffffff; --line: rgb(20 40 44 / .1); --text: #14282c; --soft: #3f5a5e; --muted: #6b8286;
            --accent: #1f8c7d; --cyan: #2f7fa6; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--base); color: var(--text);
         font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .sky i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(100px); opacity: .22; animation: drift 24s ease-in-out infinite alternate; }
  .sky i:nth-child(1) { background: var(--accent); top: -35vmax; left: -20vmax; }
  .sky i:nth-child(2) { background: var(--cyan); bottom: -40vmax; right: -25vmax; animation-delay: -12s; }
  .sky::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background: repeating-radial-gradient(circle at 50% 120%, transparent 0 38px, rgb(255 255 255 / .025) 39px 40px); animation: tide 14s linear infinite; }
  @keyframes drift { to { transform: translate(14vmax, 10vmax) scale(1.2); } }
  @keyframes tide { to { background-position: 0 -80px; } }
  main { text-align: center; max-width: 620px; }
  svg { width: clamp(120px, 26vw, 190px); color: var(--accent); filter: drop-shadow(0 0 40px color-mix(in srgb, var(--accent) 45%, transparent)); }
  svg circle, svg path { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 2.4s cubic-bezier(.2,.8,.2,1) forwards; }
  svg path:nth-of-type(1) { animation-delay: .3s; } svg path:nth-of-type(2) { animation-delay: .6s; } svg path:nth-of-type(3) { animation-delay: .9s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .tag { display: block; margin: 26px 0 10px; font: 12px/1 ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0 0 14px; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.15; letter-spacing: -.02em; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--cyan), var(--accent)); background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 6s linear infinite; }
  @keyframes sheen { to { background-position: 200% center; } }
  p { color: var(--soft); margin: 0 auto 28px; max-width: 520px; }
  .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 6px; font-weight: 600; text-decoration: none;
      color: var(--text); background: var(--surface); border: 1px solid var(--line); transition: transform .15s, box-shadow .2s; }
  a:hover { transform: translateY(-1px); }
  a.primary { background: var(--accent); color: var(--base); border-color: transparent; }
  a.primary:hover { box-shadow: 0 8px 30px color-mix(in srgb, var(--accent) 40%, transparent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  small { display: block; margin-top: 36px; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; stroke-dashoffset: 0 !important; transition: none !important; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i></div>
<main>
  <svg viewBox="100 130 320 200" fill="none" stroke="currentColor" stroke-width="29.7" role="img" aria-label="Aequalyn">
    <g transform="translate(0 20.5)"><circle cx="188.8" cy="204.8" r="64"/><path d="M252.8 204.8v78.8"/><path d="M380.8 204.8A64 64 0 1 0 365.8 245.9" stroke-linecap="round"/><path d="M252.8 204.8h128"/></g>
  </svg>
  <span class="tag">Coming soon</span>
  <h1>Aequalyn, <span>on the web</span>.</h1>
  <p>An Arch Linux desktop built around a Quickshell shell for Hyprland, coloured by your wallpaper. Its website, with the whole Market of plugins, themes, wallpapers and apps, is on its way.</p>
  <div class="links">
    <a class="primary" href="https://github.com/Aequalyn">Follow on GitHub</a>
    <a href="https://github.com/Aequalyn/aequalyn-market">The Market</a>
    <a href="https://github.com/Aequalyn/aequalyn-iso">The ISO</a>
  </div>
  <small>© 2026 Aequalyn contributors</small>
</main>
</body>
</html>
