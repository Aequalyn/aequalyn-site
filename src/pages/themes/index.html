<!--meta {"title": "Themes · Aequalyn", "description": "Every built-in Aequalyn theme, night and day: try any of them on this site, then wear it on your desktop."} -->
<div class="wrap">
  <section class="market-head">
    <span class="eyebrow">Built in</span>
    <h1>{{count:families}} themes, night and day</h1>
    <p>Each theme is a palette and its backgrounds. Click <b>Try it here</b> and the whole site wears it, on every page, until you choose another. On your desktop, install it from the Store's Built-in shelf or with the command on its page.</p>
  </section>
  <div class="view grid themes-gallery">{{themes_gallery}}</div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-wear]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); AE.wear(b.dataset.wear, b); }));
});
</script>
